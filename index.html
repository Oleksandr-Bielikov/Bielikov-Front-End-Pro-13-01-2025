<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD-application</title>
  </head>
  <body>
    <h1>Список користувачів</h1>
    <div id="user-list"></div>
    <button id="add-button">Додати користувача</button>
    <br />
    <br />
    <div id="form-container">
      <form id="add-form" style="display: none">
        <fieldset>
          <legend>Введіть дані користувача</legend>
          <label for="name"
            >Ім'я:
            <input type="text" id="name" required />
          </label>
          <br /><br />
          <label for="email"
            >Електронна пошта:
            <input type="email" id="email" required />
          </label>
          <br /><br />
          <button type="submit" id="save-button">Зберегти</button>
          <button id="cancel-button">Скасувати</button>
        </fieldset>
      </form>
    </div>
    <div id="details-container"></div>
    <script src="index.js"></script>
  </body>
</html>
