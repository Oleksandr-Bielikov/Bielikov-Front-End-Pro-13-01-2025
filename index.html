<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/front/style.css" />
    <title>Онлайн-кафе</title>
  </head>
  <body>
    <div class="container text-center">
      <div class="row">
        <!-- колонка меню -->
        <div class="col-2 menu-div">
          <button id="coffee-btn" type="button" class="btn btn-primary">
            Кава
          </button>
          <button id="burgers-btn" type="button" class="btn btn-primary">
            Бургери
          </button>
          <button id="orders-btn" type="button" class="btn btn-success">
            Кошик
          </button>
        </div>
        <!-- колонка товарів -->
        <div class="col-10">
          <div class="container d-none" id="container-coffee">
            <!-- кртка капучино -->
            <div class="card" id="card-cappucino" style="width: 18rem">
              <img
                src="/front/images/cappucino.png"
                class="card-img-top"
                alt="..."
              />
              <div class="card-body">
                <h5 class="card-title">Капучино</h5>
                <p class="card-text">
                  <form>
                    <label for="classic-capp">Стандартний</label>
                    <input type="radio" name="capp-size" id="classic-capp" value="Стандартний"/>
                    <label for="large-capp">Великий</label>
                    <input type="radio" name="capp-size" id="large-capp" value="Великий"/>
                    <br>
                    <label for="capp-vanilla">+ Ванільний сироп</label>
                    <input type="checkbox" id="capp-vanilla" value="+ Ванільний сироп">
                    <label for="capp-сhoco">+ Шоколадний сироп</label>
                    <input type="checkbox" id="capp-choco" value="+ Шоколадний сироп">
                  </form>
                </p>
                <button id="add-cappuccino-btn" class="btn btn-primary">
                  Додати в кошик
                </button>
              </div>
            </div>
            <!-- картка латте -->
            <div class="card" id="card-latte" style="width: 18rem">
              <img src="/front/images/latte.png" class="card-img-top" alt="..." />
              <div class="card-body">
                <h5 class="card-title">Латте</h5>
                <p class="card-text">
                  <form>
                    <label for="classic-latte">Стандартний</label>
                    <input type="radio" name="latte-size" id="classic-latte" value="Стандартний"/>
                    <label for="large-latte">Великий</label>
                    <input type="radio" name="latte-size" id="large-latte" value="Великий"/>
                    <br>
                    <label for="latte-vanilla">+ Ванільний сироп</label>
                    <input type="checkbox" id="latte-vanilla" value="+ Ванільний сироп">
                    <label for="latte-сhoco">+ Шоколадний сироп</label>
                    <input type="checkbox" id="latte-choco" value="+ Шоколадний сироп">
                  </form>
                </p>
                <button id="add-latte-btn" class="btn btn-primary">
                  Додати в кошик
                </button>
              </div>
            </div>
          </div>
          <!--    контейнер бургерів    -->
          <div class="container d-none" id="container-burger">
            <!-- картка гамбургер -->
            <div class="card" id="card-hamburger" style="width: 18rem">
              <img
                src="/front/images/hamburger.png"
                class="card-img-top"
                alt="..."
              />
              <div class="card-body">
                <h5 class="card-title">Гамбургер</h5>
                <p class="card-text">
                  <form>
                    <label for="classic-hamburger">Стандартний</label>
                    <input type="radio" name="hamburger-size" id="classic-hamburger" value="Стандартний"/>
                    <label for="large-hamburger">Великий</label>
                    <input type="radio" name="hamburger-size" id="large-hamburger" value="Великий"/>
                    <br>
                    <label for="hamburger-cheese">+ Сир</label>
                    <input type="checkbox" id="hamburger-cheese" value="+ Сир">
                    <br>
                    <label for="hamburger-meat">+ М'ясо</label>
                    <input type="checkbox" id="hamburger-meat" value="+ М'ясо">
                    <br>
                    <label for="hamburger-sauce">+ Соус</label>
                    <input type="checkbox" id="hamburger-sauce" value="+ Соус">
                  </form>
                </p>
                <button id="add-hamburger-btn" class="btn btn-primary">
                  Додати в кошик
                </button>
              </div>
            </div>
            <!-- картка чізбургер -->
            <div class="card" id="card-cheeseburger" style="width: 18rem">
              <img
                src="/front/images/cheeseburger.png"
                class="card-img-top"
                alt="..."
              />
              <div class="card-body">
                <h5 class="card-title">Чізбургер</h5>
                <p class="card-text">
                  <form>
                    <label for="classic-сheeseburger">Стандартний</label>
                    <input type="radio" name="сheeseburger-size" id="classic-сheeseburger" value="Стандартний"/>
                    <label for="large-сheeseburger">Великий</label>
                    <input type="radio" name="сheeseburger-size" id="large-сheeseburger" value="Великий"/>
                    <br>
                    <label for="сheeseburger-cheese">+ Сир</label>
                    <input type="checkbox" id="сheeseburger-cheese" value="+ Сир">
                    <br>
                    <label for="сheeseburger-meat">+ М'ясо</label>
                    <input type="checkbox" id="сheeseburger-meat" value="+ М'ясо">
                    <br>
                    <label for="сheeseburger-sauce">+ Соус</label>
                    <input type="checkbox" id="сheeseburger-sauce" value="+ Соус">
                  </form>
                </p>
                <button id="add-cheeseburger-btn" class="btn btn-primary">
                  Додати в кошик
                </button>
              </div>
            </div>
          </div>
          <!-- контейнер кошика -->
          <div class="container d-none" id="container-orders">
            <p>Кошик пустий</p>
          </div>
        </div>
      </div>
    </div>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="front/script.js"></script>
  </body>
</html>
