<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div style="display: flex; flex-direction: row; gap: 50px">
      <div>
        <h3>Перелік категорій</h3>
        <p>AVTO</p>
        <p>MOTO</p>
      </div>
      <div>
        <h3>Перелік товарів</h3>
        <ul class="avto" style="display: none">
          <li>Avto 1</li>
          <li>Avto 2</li>
        </ul>
        <ul class="moto" style="display: none">
          <li>Moto 1</li>
          <li>Moto 2</li>
        </ul>
      </div>
      <section>
        <h3>Інформація про товар</h3>
        <div class="avto-1" style="display: none">
          <p>Avto 1. Price: 10000</p>
          <button class="button">Buy</button>
        </div>
        <div class="avto-2" style="display: none">
          <p>Avto 2. Price: 10000</p>
          <button class="button">Buy</button>
        </div>
        <div class="moto-1" style="display: none">
          <p>Moto 1. Price: 10000</p>
          <button class="button">Buy</button>
        </div>
        <div class="moto-2" style="display: none">
          <p>Moto 2. Price: 10000</p>
          <button class="button">Buy</button>
        </div>
      </section>
    </div>
    <script src="index.js"></script>
  </body>
</html>
