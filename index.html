<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--Є текстове поле на сторінці. При фокусі на цьому полі збоку з'являється <div> з інформацією. При зникненні фокуса - так само пропадає-->
    <div style="display: flex; flex-direction: row; margin-top: 30px">
      <input type="text" />
      <div class="focus-div">
        <h2 style="display: none">
          При наведенні на інпут з'являється додатковий опис
        </h2>
      </div>
    </div>
    <!--На сторінці є дві кнопки. При натисканні на першу кнопку просимо користувача ввести в prompt посилання, 
        при натисканні на другу - переадресовується на інший сайт (за раніше введеним посиланням). 
        Реалізувати перевірку на http/https. Якщо протокол не вказано - додаємо-->
    <div
      class="buttons"
      style="
        display: flex;
        flex-direction: row;
        margin-top: 30px;
        gap: 20px;
        margin-top: 30px;
      "
    >
      <button class="button_1">Ввести дані</button>
      <button class="button_2">Перейти</button>
    </div>
    <!--Вивести таблицю 10 × 10, заповнену числами від 1 до 100 (таблиця створюється динамічно)-->
    <table class="table" style="margin-top: 30px"></table>
    <button class="generate_button">Згенерувати таблицю</button>
    <!--У папці images є зображення 1.jpg, 2.jpg, 3.jpg, 4.jpg, 5.jpg, 6.jpg, 7.jpg, 8.jpg, 9.jpg. 
        Вивести зображення з цієї папки отримане випадковим чином (Math.random)-->
    <div style="margin-top: 30px">
      <div class="random_photo" style="display: none">
        <img src="images/img_1.jpg" width="300px" height="300px" alt="1" />
        <img src="images/img_2.jpg" width="300px" height="300px" alt="2" />
        <img src="images/img_3.jpg" width="300px" height="300px" alt="3" />
        <img src="images/img_4.jpg" width="300px" height="300px" alt="4" />
        <img src="images/img_5.jpg" width="300px" height="300px" alt="5" />
        <img src="images/img_6.jpg" width="300px" height="300px" alt="6" />
        <img src="images/img_7.jpg" width="300px" height="300px" alt="7" />
        <img src="images/img_8.jpg" width="300px" height="300px" alt="8" />
        <img src="images/img_9.jpg" width="300px" height="300px" alt="9" />
      </div>
      <button class="generate_photo">Generate Photo</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
